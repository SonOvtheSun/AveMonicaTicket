<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AveMonica 可靠性 Benchmark</title>
  <style>
    :root{--bg:#07111f;--panel:#0e1b2c;--panel2:#12243a;--text:#ecf4ff;--muted:#8da4bd;--line:#233951;--cyan:#20d5d2;--green:#38d996;--red:#ff647c;--amber:#ffbf5b}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0,#12304a 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}
    main{max-width:1180px;margin:auto;padding:42px 24px 80px} h1{font-size:34px;margin:8px 0} h2{font-size:20px;margin:4px 0} p{color:var(--muted)} .eyebrow,small{color:var(--cyan);letter-spacing:.12em;text-transform:uppercase}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0} .summary-card,.metric{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px}
    .summary-card span,.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px} .summary-card strong{font-size:24px} .metric strong{font-size:16px;word-break:break-word}
    .panel,.scenario{background:rgba(14,27,44,.94);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 18px 55px rgba(0,0,0,.18)}
    .bar-row{display:grid;grid-template-columns:240px 1fr 110px;gap:14px;align-items:center;margin:12px 0;font-size:13px} .bar-track{height:11px;background:#091522;border-radius:999px;overflow:hidden} .bar-fill{height:100%;background:var(--cyan);border-radius:999px} .bar-fill.fail{background:var(--red)} .bar-fill.skip{background:var(--amber)} code{color:var(--muted)}
    .scenario-head{display:flex;justify-content:space-between;align-items:center} .status,.badge{font-size:12px;font-weight:800;border-radius:999px;padding:7px 11px} .status.pass,.badge.pass{color:var(--green);background:rgba(56,217,150,.12)} .status.fail,.badge.fail{color:var(--red);background:rgba(255,100,124,.12)} .status.skip{color:var(--amber);background:rgba(255,191,91,.12)}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0} table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px} th{color:var(--muted);font-weight:600} .error{border-left:3px solid var(--red);background:rgba(255,100,124,.08);padding:12px;margin:14px 0;color:#ffc4ce} .notes{color:var(--muted)} .muted{color:var(--muted)}
    @media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.bar-row{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body><main>
  <div class="eyebrow">Reliability benchmark</div>
  <h1>AveMonica 票务可靠性报告</h1>
  <p>Run ID：selfcheck　生成时间：2026-08-18T16:50:57+08:00</p>
  <div class="summary">
        <div class="summary-card"><span>通过</span><strong>1</strong></div>
        
        <div class="summary-card"><span>失败</span><strong>0</strong></div>
        
        <div class="summary-card"><span>跳过</span><strong>0</strong></div>
        
        <div class="summary-card"><span>通过率</span><strong>100.0%</strong></div>
        
        <div class="summary-card"><span>总耗时</span><strong>0.0 ms</strong></div>
        </div>
  <section class="panel"><h2>各场景耗时</h2><p>横条按本次最慢场景归一化，用于快速定位等待与恢复瓶颈。</p>
        <div class="bar-row">
          <span class="bar-label">1. 自检</span>
          <div class="bar-track"><div class="bar-fill pass" style="width:2.00%"></div></div>
          <code>0.0 ms</code>
        </div>
        </section>
  
            <section class="scenario">
              <div class="scenario-head">
                <div><small>场景 1</small><h2>自检</h2></div>
                <span class="status pass">PASS</span>
              </div>
              <div class="metrics"><div class='metric'><span>QPS</span><strong>123.45</strong></div><div class='metric'><span>P95(ms)</span><strong>8.2</strong></div></div>
              
              <table><thead><tr><th>断言</th><th>期望</th><th>实际</th><th>结果</th></tr></thead><tbody>
            <tr>
              <td>✓ HTML断言</td>
              <td>是</td>
              <td>是</td>
              <td><span class="badge pass">通过</span></td>
            </tr>
            </tbody></table>
              
            </section>
            
  <section class="panel"><h2>测试环境</h2><table><tbody><tr><td>mode</td><td>unit</td></tr></tbody></table></section>
</main></body></html>
